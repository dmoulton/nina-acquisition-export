name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run export logic tests
        run: dotnet run --project tests/AcquisitionExport.Core.Tests

      - name: Build plugin
        run: dotnet build src/NinaAcquisitionExport/NinaAcquisitionExport.csproj -c Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NinaAcquisitionExport
          path: src/NinaAcquisitionExport/bin/Release/net8.0-windows/NinaAcquisitionExport.dll
          if-no-files-found: error
      - name: Publish pre-release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "NinaAcquisitionExport-${{ github.ref_name }}.zip"
          Compress-Archive -Path src/NinaAcquisitionExport/bin/Release/net8.0-windows/NinaAcquisitionExport.dll -DestinationPath $zip
          gh release create "${{ github.ref_name }}" $zip --prerelease --generate-notes
