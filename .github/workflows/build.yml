name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run export logic tests
        run: dotnet run --project tests/AcquisitionExport.Core.Tests

      - name: Build plugin
        run: dotnet build src/NinaAcquisitionExport/NinaAcquisitionExport.csproj -c Release

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: NinaAcquisitionExport
          path: src/NinaAcquisitionExport/bin/Release/net8.0-windows/NinaAcquisitionExport.dll
          if-no-files-found: error
